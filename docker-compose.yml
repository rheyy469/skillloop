services:
  db:
    image: postgres:17-alpine
    container_name: skillloop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillloop}
      POSTGRES_USER: ${POSTGRES_USER:-skillloop_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillloop_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-skillloop_dev} -d $${POSTGRES_DB:-skillloop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillloop-app
    profiles: ["fullstack"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillloop_dev}:${POSTGRES_PASSWORD:-skillloop_dev_password}@db:5432/${POSTGRES_DB:-skillloop}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-skillloop-docker-session-secret-key-at-least-32-chars}
      FRONTEND_ORIGIN: http://localhost:4000
    ports:
      - "4000:4000"

volumes:
  postgres_data:
